<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фотоальбом мамы</title>
    <style>
        :root {
            --card-bg: #fffdf9;
            --text-color: #333333;
            --primary: #ff6b81;
            --primary-hover: #ff4757;
            --shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: url('1794271747851.jpg') no-repeat center center fixed;
            background-size: cover;
            background-color: #f0f4f8;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            margin-top: 20px;
        }

                h1 {
    font-size: 2.2rem;
    font-family: 'Georgia', serif;
    color: #ffd700; /* Яркий насыщенный чистый золотой цвет */
    margin-bottom: 8px;
    font-weight: 700;
    
    /* Тень: темно-коричневая подложка (чтобы выделялось) + золотое свечение */
    text-shadow: 
        0 2px 4px rgba(44, 29, 17, 0.9),
        0 0 10px rgba(255, 215, 0, 0.8),
        0 0 20px rgba(212, 175, 55, 0.6);
}



                p.subtitle {
            color: #ffffff;
            margin-bottom: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }


        /* Сетка для кнопок-рамок */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 480px) {
            .buttons-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Превращаем кнопки в картины с золотым багетом */
        .age-btn {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 8px;
            padding: 25px 15px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #2c1d11;
            cursor: pointer;
            
            /* Эффект рамки */
            border: 8px solid #d4af37; 
            outline: 4px solid #5c3a21; 
            outline-offset: -12px;
            
            box-shadow: 0 12px 25px rgba(0,0,0,0.3), inset 0 0 20px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 110px;
            text-align: center;
            text-shadow: 0 1px 1px rgba(255,255,255,0.8);
        }

        .age-btn span {
            font-size: 0.85rem;
            font-weight: normal;
            color: #747d8c;
            margin-top: 5px;
        }

        .age-btn:hover {
            transform: translateY(-5px);
        }

        .age-btn:active {
            transform: scale(0.97);
        }

        .age-btn.active {
            transform: scale(0.98);
            border-color: #ff6b81;
        }

        /* Окно галереи */
        .gallery-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.4s ease-in-out;
            display: none;
            border: 4px solid #d4af37;
        }

        .gallery-card.visible {
            display: block;
        }

        .gallery-title {
            font-size: 1.4rem;
            color: #5c3a21;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }

        .photo-frame {
            background: #fff;
            padding: 8px 8px 25px 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border-radius: 4px;
            transform: rotate(-1deg);
            transition: transform 0.3s;
        }

        .photo-frame:nth-child(even) {
            transform: rotate(2deg);
        }

        .photo-frame:hover {
            transform: scale(1.05) rotate(0deg);
            z-index: 10;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .photo-frame img {
            width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 2px;
            display: block;
        }

        .photo-caption {
            font-size: 0.8rem;
            color: #57606f;
            margin-top: 8px;
            font-family: cursive, sans-serif;
        }

        .welcome-text {
            color: #5c3a21;
            font-style: italic;
            padding: 20px;
            background: #fffdf9;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 2px solid #d4af37;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Любимая мама 💕</h1>
        <p class="subtitle">Выберите ячейку, чтобы посмотреть альбом</p>

<!-- Блок музыкального плеера -->
    <!-- Компактная кнопка музыки без фона -->
    <div style="text-align: center; margin: 15px 0;">
        <audio id="bg-audio" loop>
            <source src="Max Schultz - The Howler.mp3" type="audio/mpeg">
            Ваш браузер не поддерживает аудио.
        </audio>
        <button onclick="toggleAudio()" id="audio-btn" style="background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 20px; font-size: 0.9rem; cursor: pointer; box-shadow: 0 4px 15px rgba(255,107,129,0.4);">
            ▶ Включить музыку
        </button>
    </div>

    <script>
        function toggleAudio() {
            const audio = document.getElementById('bg-audio');
            const btn = document.getElementById('audio-btn');
            
            if (audio.paused) {
                audio.play();
                btn.textContent = '⏸ Выключить музыку';
            } else {
                audio.pause();
                btn.textContent = '▶ Включить музыку';
            }
        }
    </script>

<script>
    function toggleAudio() {
        const audio = document.getElementById('bg-audio');
        const btn = document.getElementById('audio-btn');
        
        if (audio.paused) {
            audio.play();
            btn.textContent = '⏸ Выключить музыку';
        } else {
            audio.pause();
            btn.textContent = '▶ Включить музыку';
        }
    }
</script>


        <!-- Кнопки от 0 до 5 -->
        <div class="buttons-grid">
            <button class="age-btn" onclick="showGallery(0)">ВСЕГДА МОЛОДАЯ <span></span></button>
            <button class="age-btn" onclick="showGallery(1)">РАБОЧИЕ МОМЕНТЫ <span></span></button>
            <button class="age-btn" onclick="showGallery(2)">СЕМЬЯ <span></span></button>
            <button class="age-btn" onclick="showGallery(3)">МОИ ДРУЗЬЯ <span></span></button>
            <button class="age-btn" onclick="showGallery(4)">Я НА ДАЧЕ <span></span></button>
            <button class="age-btn" onclick="showGallery(5)">ПИТОМЦЫ <span></span></button>
        </div>

        <!-- Контейнер для фотографий -->
        <div id="gallery-container">
            <div class="welcome-text">Нажмите на любую кнопку выше, чтобы открыть фотографии 📸</div>
        </div>
    </div>

    <script>
        // Здесь можно заменить ссылки на фотографии вашей дочки
        const photoData = {
            0: {
                title: "Возраст: от 0 до 1 года",
                photos: [
                    { url: "20220401_141410.jpg", caption: "Первые дни дома" },
                    { url: "IMG_20261109_205812_018.jpg", caption: "Улыбаемся" }
                ]
            },
            1: {
                title: "Возраст: от 1 до 2 лет",
                photos: [
                    { url: "IMG_20261109_210822_258.jpg", caption: "Я умею ходить!" },
                    { url: "IMG_20261109_220543_279.jpg", caption: "Ура, мне годик!" }
                ]
            },
            2: {
                title: "Возраст: от 2 до 3 лет",
                photos: [
                    { url: "IMG_20261109_222535_619.jpg", caption: "Мир прекрасен" },
                    { url: "IMG_20261109_222541_833.jpg", caption: "Пора в садик!" },
                    {url: "IMG_20261109_222537_445.jpg", caption: "У меня свои делишки" },
                    {url: "IMG_20261109_222539_950.jpg", caption: "Полетели!" },
                    {url: "IMG_20261109_222544_083.jpg", caption: "Дорога домой" }
                ]
            },
            3: {
                title: "Возраст: от 3 до 4 лет",
                photos: [
                    { url: "IMG_20261109_231018_791.jpg", caption: "Я кривляка" },
                    { url: "IMG_20261109_231044_393.jpg", caption: "Моё море" },
                    { url: "IMG_20261109_231232_422.jpg", caption: "Магия" },
                    { url: "IMG_20261109_231356_013.jpg", caption: "Позирую" }
                ]
            },
            4: {
                title: "Возраст: от 4 до 5 лет",
                photos: [
                    { url: "IMG_20261109_231333_329.jpg", caption: "Я принцесса" },
                    { url: "IMG_20261109_231422_196.jpg", caption: "Пойду-ка в школу" }
                ]
            },
            5: {
                title: "Возраст: 5 лет и старше",
                photos: [
                    { url: "IMG_20261109_231450_125.jpg", caption: "Мне 5!" },
                    { url: "IMG_20261109_231515_594.jpg", caption: "Хеллоуин" },
                    { url: "IMG_20261109_231502_111.jpg", caption: "Barbie" }
                ]
            }
        };

        function showGallery(age) {
            const buttons = document.querySelectorAll('.age-btn');
            buttons.forEach((btn, index) => {
                if(index === age) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            const data = photoData[age];
            const container = document.getElementById('gallery-container');
            
            let html = `
                <div class="gallery-card visible">
                    <div class="gallery-title">${data.title}</div>
                    <div class="photos-grid">
            `;

            data.photos.forEach(photo => {
                html += `
                    <div class="photo-frame">
                        <img src="${photo.url}" alt="Фото">
                        <div class="photo-caption">${photo.caption}</div>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }
    </script>
</body>
</html>
